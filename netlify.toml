[build]
publish = "site"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[redirects]]
from = "/contact"
to = "/contact.html"
status = 200

[[redirects]]
from = "/services"
to = "/services.html"
status = 200

[[redirects]]
from = "/"
to = "/index.html"
status = 200
